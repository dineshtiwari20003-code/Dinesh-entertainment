<!DOCTYPE html>
<html>

<head>

<title>Dinesh Entertainment</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #111;
    color: white;
}

header {
    background-color: #000;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

nav a:hover {
    color: red;
}

.hero {
    text-align: center;
    padding: 80px 20px;
    background-color: #222;
}

.hero h1 {
    font-size: 45px;
}

.hero p {
    font-size: 20px;
}

.price {
    font-size: 30px !important;
    font-weight: bold;
    color: #00ff00;
}

.join-button {
    display: inline-block;
    background-color: red;
    color: white;
    text-decoration: none;
    padding: 14px 30px;
    font-size: 18px;
    border-radius: 5px;
    margin-top: 15px;
}

.join-button:hover {
    background-color: darkred;
}

.movies {
    padding: 30px;
}

.movies h2 {
    margin-bottom: 25px;
}

.movie-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
}

.movie-image {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border: 3px solid white;
    border-radius: 5px;
}

@media (max-width: 1200px) {
    .movie-container {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 900px) {
    .movie-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 600px) {
    .movie-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>

</head>

<body>

<header>

<div class="logo">
🎬 Dinesh Entertainment
</div>

<nav>

</a>

</a>

</a>

<a href="membership.html">

</a>

</nav>

</header>

<div class="hero">

<h1>
Movies & Web Series
</h1>

<p>
Watch your favourite Movies And Web Series
</p>

<p class="price">
₹60 / Month
</p>

<p>
Get access to Movies & Web Series for 1 month
</p>

<a
href="membership.html"
class="join-button">

Join Now - ₹60

</a>

</div>

<div class="movies">

<h2>
🎬 Latest Movies And Web Series
</h2>

<div class="movie-container">

<img src="iron.jpg" class="movie-image">

<img src="kabir.jpg" class="movie-image">

<img src="movie.jpg" class="movie-image">

<img src="od.jpg" class="movie-image">

<img src="spider.jpg" class="movie-image">

<img src="wwe.jpg" class="movie-image">

<img src="cars.jpg" class="movie-image">

</div>

</div>

</body>

</html>
