<!DOCTYPE html>
<html>

<head>

<title>Payment Successful - Dinesh Entertainment</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background:
        radial-gradient(circle at top left, #5b21b6, transparent 35%),
        radial-gradient(circle at top right, #dc2626, transparent 35%),
        radial-gradient(circle at bottom, #0369a1, transparent 40%),
        #080808;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}


/* =========================
   MAIN BOX
========================= */

.box {

    width: 500px;
    max-width: 92%;

    padding: 45px 30px;

    text-align: center;

    background: rgba(25, 25, 35, 0.92);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 25px;

    box-shadow:
        0 0 30px rgba(255,0,80,0.25),
        0 0 60px rgba(0,100,255,0.15);

    backdrop-filter: blur(10px);

}


/* =========================
   LOGO
========================= */

.logo {

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 30px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff7a00,
        #ffff00,
        #00ff88,
        #00aaff,
        #cc00ff
    );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}


/* =========================
   SUCCESS ICON
========================= */

.success-icon {

    width: 100px;
    height: 100px;

    margin: auto;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #00ff88,
        #00c853
    );

    box-shadow:
        0 0 20px #00ff88,
        0 0 50px rgba(0,255,136,0.5);

    font-size: 55px;

    animation: pop 0.8s ease;

}


@keyframes pop {

    0% {
        transform: scale(0);
    }

    70% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   TITLE
========================= */

h1 {

    margin-top: 30px;

    font-size: 38px;

    background: linear-gradient(
        90deg,
        #00ff88,
        #00ffff,
        #00ff88
    );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}


/* =========================
   TEXT
========================= */

.subtitle {

    font-size: 18px;

    color: #ddd;

    margin-bottom: 30px;

}


/* =========================
   MEMBERSHIP BOX
========================= */

.membership {

    padding: 25px;

    border-radius: 18px;

    background: linear-gradient(
        135deg,
        rgba(255,0,80,0.18),
        rgba(120,0,255,0.18),
        rgba(0,180,255,0.18)
    );

    border: 1px solid rgba(255,255,255,0.15);

    margin-top: 20px;

}


.membership h2 {

    margin: 0 0 15px 0;

    font-size: 25px;

}


.active {

    display: inline-block;

    padding: 10px 20px;

    border-radius: 25px;

    background: rgba(0,255,100,0.15);

    border: 1px solid #00ff88;

    color: #00ff88;

    font-size: 18px;

    font-weight: bold;

    box-shadow: 0 0 15px rgba(0,255,136,0.25);

}


.membership p {

    color: #ddd;

}


/* =========================
   MOVIES BUTTON
========================= */

.movies-button {

    display: inline-block;

    margin-top: 30px;

    padding: 15px 35px;

    border-radius: 30px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff4d00,
        #ff0080
    );

    color: white;

    text-decoration: none;

    font-size: 19px;

    font-weight: bold;

    box-shadow:
        0 0 15px rgba(255,0,80,0.5);

    transition: 0.3s;

}


.movies-button:hover {

    transform: scale(1.07);

    box-shadow:
        0 0 30px rgba(255,0,80,0.8);

}


/* =========================
   HOME BUTTON
========================= */

.home-button {

    display: block;

    margin-top: 22px;

    color: #ccc;

    text-decoration: none;

    font-size: 16px;

}


.home-button:hover {

    color: white;

}


/* =========================
   CONFETTI
========================= */

.confetti {

    position: fixed;

    width: 10px;

    height: 10px;

    top: -20px;

    animation: fall linear infinite;

}


@keyframes fall {

    0% {

        transform:
            translateY(-20px)
            rotate(0deg);

        opacity: 1;

    }

    100% {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;

    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .box {

        padding: 35px 20px;

    }

    h1 {

        font-size: 30px;

    }

    .logo {

        font-size: 21px;

    }

}

</style>
